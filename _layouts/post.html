---
layout: default
---

{%-include back_link.html-%}

<article>
  <p class="post-meta">
    <time datetime="{{ page.date }}">{{ page.date | date: site.theme_config.date_format }}</time>
  </p>

  <h1>{{ page.title }}</h1>

  {{ content }}

  {%- if page.tags.size > 0 -%}
  <p>tags: {% for tag in page.tags %}<a href="{{ "/tags#" | append: tag | relative_url }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
  {%- endif -%}
</article>
